reports:
- id: company
  title: Company & Product Updates
  categories:
  - Lab
  - Blog
  - Infra
  - Tools
  slots:
  - 07:30
  - '17:30'
  max_stories: 12
  max_paper_stories: 0
  focus: Official company blogs, model/API announcements, coding tools, product releases
    and inference infrastructure. Require a concrete new development; exclude generic
    marketing. Require material impact beyond routine maintenance or minor tool features;
    do not fill the report with patch notes or small benchmark deltas.
  freshness_hours: 48
- id: blogs
  title: Blogs & Analysis
  categories:
  - Analysis
  - Aggregator
  exclude_ids:
  - aggregator-hacker-news
  slots:
  - '12:30'
  max_stories: 10
  max_paper_stories: 0
  focus: Independent AI engineering commentary, technical deep dives and useful analysis
    from the configured authors and newsletters. Substantive new analysis is eligible;
    exclude unrelated programming posts and recycled announcements. Require material
    impact beyond routine maintenance or minor tool features; do not fill the report
    with patch notes or small benchmark deltas.
  freshness_hours: 168
- id: research_oss
  title: Research & Open Source
  categories:
  - Research
  - GitHub
  - Discovery
  - Model hub
  - Community
  exclude_ids:
  - community-r-singularity
  source_ids:
  - aggregator-hacker-news
  slots:
  - '15:30'
  max_stories: 12
  max_paper_stories: 6
  focus: Research papers, open models, GitHub releases, datasets, local inference
    and community engineering discoveries. Distinguish a repository creation or paper
    submission from a validated model release. Keep practical engineering relevance
    high. Require material impact beyond routine maintenance or minor tool features;
    do not fill the report with patch notes or small benchmark deltas.
  freshness_hours: 72
  max_per_source: 100
  min_score: 60
- id: x_major
  title: X — AI Voices
  source_ids:
  - x-analyst-swyx-shawn-wang
  - x-analyst-nathan-lambert
  - x-analyst-simon-willison
  - x-news-akhaliq
  - x-news-reach-vb
  - x-news-min-choi
  - x-news-the-ai-grid
  - x-news-clement-delangue
  - x-news-andrew-ng
  - x-news-rowan-cheung
  - x-news-heybarsee
  - x-news-kimmonismus
  - x-news-bindu-reddy
  - x-news-linus-ekenstam
  slots:
  - '20:30'
  x_only: true
  omit_delivered: false
  reject_routine_updates: false
  max_per_source: 3
  max_stories: 12
  max_paper_stories: 0
  send_empty: true
  min_score: 25
  min_impact: 20
  min_breadth: 15
  min_novelty: 10
  min_quality: 20
  min_tier: 1
  focus: 'High-frequency AI news spreaders: swyx (ecosystem news), Nathan Lambert
    (frontier lab developments), Simon Willison (LLM tools and applications),
    akhaliq (fastest same-day research and model-release news), reach_vb (open-model
    releases), Min Choi (papers and product news), TheAIGRID (general AI news),
    Clement Delangue (open-model and HF ecosystem news), Andrew Ng (industry news),
    Rowan Cheung (breaking AI news and launches), Barsee (AI tools and demos),
    Chubby (frontier models, benchmarks, robotics), Bindu Reddy (benchmarks and
    lab moves) and Linus Ekenstam (creative AI tools and product launches).
    The bucket should surface the day AI developments at volume; ranking selects
    the most important. Prioritize model releases, capability milestones, notable
    launches and concrete industry news. Exclude memes, reposts and stories already
    delivered through other reports.'
  enabled: true
  freshness_hours: 24

- id: singularity
  title: Reddit — r/singularity Daily
  source_ids:
  - community-r-singularity
  slots:
  - 08:30
  - '18:30'
  max_per_source: 25
  max_stories: 8
  max_paper_stories: 0
  min_score: 55
  send_empty: false
  focus: 'Community-surfaced AI news from r/singularity: frontier model releases,
    capability milestones, notable industry moves and high-engagement AI developments.
    Exclude memes, daily discussion threads, screenshots and doomer/utopia speculation
    without concrete developments. Prefer posts linking primary sources.'
  enabled: true
  freshness_hours: 24

- id: ai_news
  title: AI News — Tech Press Digest
  source_ids:
  - news-techcrunch-ai
  - news-the-verge-ai
  - news-mit-technology-review-ai
  - news-arstechnica-ai
  slots:
  - 09:15
  - '19:15'
  max_per_source: 15
  max_stories: 10
  max_paper_stories: 0
  min_score: 55
  send_empty: false
  focus: 'Breaking AI news from the tech press: frontier model releases, major product
    launches, industry and policy developments, notable research coverage. Two
    editions per day. Prefer same-day primary developments over commentary and
    analysis pieces. Exclude weekly digests and sponsored content.'
  enabled: true
  freshness_hours: 24

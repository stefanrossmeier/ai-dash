# Independently owned stack and explicitly owned internal gateway network.
name: ai-dash

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

x-worker-env: &worker-env
  DATABASE_URL: ${DATABASE_URL:?Run scripts/init-runtime.py first}
  MODE: worker
  BASE_INTERNAL_URL: http://windmill_server:8000

x-app: &app
  image: ai-dash-app:local
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:18
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-runtime.py first}
      POSTGRES_DB: windmill
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d windmill']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  windmill_server:
    image: ${WM_IMAGE:-ghcr.io/windmill-labs/windmill:1.775.1}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODE: server
      BASE_URL: http://127.0.0.1:${AI_DASH_WINDMILL_PORT:-18090}
    ports:
      - '127.0.0.1:${AI_DASH_WINDMILL_PORT:-18090}:8000'
    volumes:
      - worker_logs:/tmp/windmill/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/api/version]
      interval: 5s
      timeout: 5s
      retries: 60
    logging: *logging

  # Orchestrates flows and dependency jobs independently of the application worker.
  windmill_worker:
    image: ${WM_IMAGE:-ghcr.io/windmill-labs/windmill:1.775.1}
    restart: unless-stopped
    environment:
      <<: *worker-env
      WORKER_GROUP: default
    volumes:
      - worker_cache:/tmp/windmill/cache
      - worker_logs:/tmp/windmill/logs
    depends_on:
      windmill_server:
        condition: service_healthy
    logging: *logging

  windmill_worker_aidash:
    <<: *app
    networks: [default, gateway]
    build:
      context: ${AI_DASH_SOURCE:-..}
      dockerfile: deploy/windmill-worker.Dockerfile
      args:
        WM_IMAGE: ${WM_IMAGE:-ghcr.io/windmill-labs/windmill:1.775.1}
    environment:
      <<: *worker-env
      WORKER_TAGS: aidash
      AI_DASH_HOME: /opt/ai-dash
      AI_DASH_DATA_DIR: /data/ai-dash
      # Dedicated llm-gateway instance (ai-dash-llm-gateway, joined to this
      # network) replaces the old shared ranking gateway. Bearer token from
      # the instance deployment; see docs/DEPLOYMENT.md.
      AI_DASH_GATEWAY_URL: http://ai-dash-llm-gateway:8080
      AI_DASH_GATEWAY_TOKEN_FILE: /run/ai-dash-secrets/gateway_token
      AI_DASH_TELEGRAM_TOKEN_FILE: /run/ai-dash-secrets/telegram_token
      AI_DASH_TELEGRAM_CHAT_ID_FILE: /run/ai-dash-secrets/telegram_chat_id
      AI_DASH_REDDIT_CLIENT_ID_FILE: /run/ai-dash-secrets/reddit_client_id
      AI_DASH_REDDIT_CLIENT_SECRET_FILE: /run/ai-dash-secrets/reddit_client_secret
      AI_DASH_REDDIT_USER_AGENT_FILE: /run/ai-dash-secrets/reddit_user_agent
    volumes:
      - ${AI_DASH_DATA_SOURCE:-/var/code/ai-dash-data}:/data/ai-dash
      - ${AI_DASH_SECRETS_SOURCE:-/var/code/ai-dash-runtime/secrets}/telegram_token:/run/ai-dash-secrets/telegram_token:ro
      - ${AI_DASH_SECRETS_SOURCE:-/var/code/ai-dash-runtime/secrets}/telegram_chat_id:/run/ai-dash-secrets/telegram_chat_id:ro
      - ${AI_DASH_GATEWAY_TOKEN_SOURCE:-/var/code/llm-gateway-deployments/ai-dash/tokens/gateway.token}:/run/ai-dash-secrets/gateway_token:ro
      - type: bind
        source: ${AI_DASH_SECRETS_SOURCE:-/var/code/ai-dash-runtime/secrets}/reddit_client_id
        target: /run/ai-dash-secrets/reddit_client_id
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AI_DASH_SECRETS_SOURCE:-/var/code/ai-dash-runtime/secrets}/reddit_client_secret
        target: /run/ai-dash-secrets/reddit_client_secret
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AI_DASH_SECRETS_SOURCE:-/var/code/ai-dash-runtime/secrets}/reddit_user_agent
        target: /run/ai-dash-secrets/reddit_user_agent
        read_only: true
        bind: {create_host_path: false}
      - worker_logs:/tmp/windmill/logs
    depends_on:
      windmill_server:
        condition: service_healthy


volumes:
  db_data:
  worker_cache:
  worker_logs:

networks:
  gateway:
    external: true
    name: ${AI_DASH_GATEWAY_NETWORK:?Set the owned internal gateway network}
